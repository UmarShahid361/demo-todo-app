<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Task Planner</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <header>
      <h1>Task Planner</h1>
      <p id="stats" aria-live="polite"></p>
    </header>

    <form id="new-task">
      <input id="title" placeholder="New task" autocomplete="off" required />
      <select id="priority" aria-label="Priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <input id="due" type="date" aria-label="Due date" />
      <input id="tags" placeholder="tags, comma separated" autocomplete="off" />
      <button type="submit">Add</button>
    </form>
    <p id="error" role="alert"></p>

    <div class="filters">
      <input id="search" type="search" placeholder="Search, or #tag" aria-label="Search" />
      <select id="filter-priority" aria-label="Filter by priority">
        <option value="">Any priority</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
    </div>

    <main id="board"></main>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
